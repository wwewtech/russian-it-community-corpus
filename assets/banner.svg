<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <radialGradient id="glowSpot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />
  <rect width="1200" height="380" fill="url(#glowSpot)" rx="16" />

  <!-- Subtle Ambient Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Tag Pill -->
  <g transform="translate(80, 50)">
    <rect width="320" height="32" rx="16" fill="url(#badgeGrad)" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">ZERO-PII LLM CURATION PLATFORM</text>
  </g>

  <!-- Title Heading -->
  <text x="80" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Russian IT Community Corpus
  </text>

  <!-- Subtitle -->
  <text x="80" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    1,270,000+ Raw Discussions (2018–2026) · SFT Multi-Turn · DPO Pairs · RAG Knowledge Base · LoRA Ready
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 225)">
    <!-- Metric 1: Clean Messages -->
    <g transform="translate(0, 0)">
      <rect width="235" height="90" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">1,200,000+</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Cleaned Messages (Zero-PII)</text>
    </g>

    <!-- Metric 2: SFT Dialogues -->
    <g transform="translate(265, 0)">
      <rect width="235" height="90" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">90,000+</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Multi-turn SFT Dialogues</text>
    </g>

    <!-- Metric 3: RAG Chunks -->
    <g transform="translate(530, 0)">
      <rect width="235" height="90" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#818cf8">150,000+</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Vector RAG Chunks</text>
    </g>

    <!-- Metric 4: Quality Benchmark Score -->
    <g transform="translate(795, 0)">
      <rect width="245" height="90" rx="12" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#34d399">94.2%</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">LoRA Accuracy on RTX 3060</text>
    </g>
  </g>

  <!-- Right Decorative Modernist Tech Graphic -->
  <g transform="translate(1030, 60)" opacity="0.85">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="60" cy="60" r="30" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
    <circle cx="60" cy="60" r="10" fill="#38bdf8" />
  </g>
</svg>
