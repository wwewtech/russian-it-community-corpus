<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="#020617" rx="16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    End-to-End Data Engineering &amp; ML Curation Pipeline
  </text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    From 1.27M raw multi-chat messages to zero-PII ML formats, RAG knowledge vectors, and LoRA adapters
  </text>

  <!-- Stage 1: Ingestion -->
  <g transform="translate(40, 100)">
    <rect width="165" height="120" rx="10" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. INGESTION</text>
    <text x="15" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Raw Telegram</text>
    <text x="15" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">1,270,000+ msgs</text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#64748b">3 Chat Exports</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="160" x2="230" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2: Dual PII Scrubbing -->
  <g transform="translate(235, 100)">
    <rect width="165" height="120" rx="10" fill="url(#boxBg)" stroke="#818cf8" stroke-width="1.5" />
    <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8">2. ZERO-PII SCRUB</text>
    <text x="15" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">RegEx + NER</text>
    <text x="15" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">6 Russian cases</text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#64748b">Smart Whitelist</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="400" y1="160" x2="425" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 3: MinHash LSH -->
  <g transform="translate(430, 100)">
    <rect width="165" height="120" rx="10" fill="url(#boxBg)" stroke="#c084fc" stroke-width="1.5" />
    <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">3. DEDUPLICATION</text>
    <text x="15" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">MinHash LSH</text>
    <text x="15" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">128 Permutations</text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#64748b">Exact Hashing</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="595" y1="160" x2="620" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 4: Thread DAG -->
  <g transform="translate(625, 100)">
    <rect width="165" height="120" rx="10" fill="url(#boxBg)" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">4. GRAPH DAG</text>
    <text x="15" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Thread Builder</text>
    <text x="15" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">Reply Resolution</text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#64748b">Temporal Clusters</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="790" y1="160" x2="815" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 5: Multi-Format Exporter -->
  <g transform="translate(820, 100)">
    <rect width="140" height="120" rx="10" fill="url(#boxBg)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="12" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b">5. EXPORTER</text>
    <text x="12" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Parquet / JSONL</text>
    <text x="12" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8">ShareGPT / ChatML</text>
    <text x="12" y="92" font-family="sans-serif" font-size="11" fill="#64748b">DPO / RAG Chunks</text>
  </g>

  <!-- Bottom Outcomes Row -->
  <g transform="translate(40, 250)">
    <!-- Outcome A: Streamlit Studio -->
    <rect width="285" height="135" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🖥️ Web Data Studio</text>
    <text x="20" y="56" font-family="sans-serif" font-size="12" fill="#cbd5e1">Interactive Streamlit UI (app.py)</text>
    <text x="20" y="76" font-family="sans-serif" font-size="11" fill="#94a3b8">• Dataset explorer with domain filters</text>
    <text x="20" y="94" font-family="sans-serif" font-size="11" fill="#94a3b8">• SFT chat cards &amp; DPO comparator</text>
    <text x="20" y="112" font-family="sans-serif" font-size="11" fill="#94a3b8">• Real-time Zero-PII sandbox</text>
  </g>

  <g transform="translate(355, 250)">
    <!-- Outcome B: Deep Analytics & Reports -->
    <rect width="290" height="135" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8">📊 Analytics &amp; Reports</text>
    <text x="20" y="56" font-family="sans-serif" font-size="12" fill="#cbd5e1">DeepChatAnalyzer (800+ lines)</text>
    <text x="20" y="76" font-family="sans-serif" font-size="11" fill="#94a3b8">• Shannon Entropy &amp; Slang Radar</text>
    <text x="20" y="94" font-family="sans-serif" font-size="11" fill="#94a3b8">• Social Graph &amp; Influencer Centrality</text>
    <text x="20" y="112" font-family="sans-serif" font-size="11" fill="#94a3b8">• Market Intelligence &amp; Whitepapers</text>
  </g>

  <g transform="translate(675, 250)">
    <!-- Outcome C: Local LoRA & RAG -->
    <rect width="285" height="135" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">⚡ Local LoRA &amp; RAG</text>
    <text x="20" y="56" font-family="sans-serif" font-size="12" fill="#cbd5e1">RTX 3060 (12GB) Optimized</text>
    <text x="20" y="76" font-family="sans-serif" font-size="11" fill="#94a3b8">• QLoRA 4-bit fine-tuning (PEFT/TRL)</text>
    <text x="20" y="94" font-family="sans-serif" font-size="11" fill="#94a3b8">• Semantic RAG retrieval pipeline</text>
    <text x="20" y="112" font-family="sans-serif" font-size="11" fill="#94a3b8">• 100-Question domain benchmark</text>
  </g>
</svg>
