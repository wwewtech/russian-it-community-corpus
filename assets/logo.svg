<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="200" height="200" rx="44" fill="url(#darkBg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Inner Neural Graph Structure -->
  <g filter="url(#glow)">
    <!-- Connecting Hexagonal Rays -->
    <path d="M100 35 L155 67 L155 133 L100 165 L45 133 L45 67 Z" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="4 4" />
    
    <!-- Central Geometric Node Prism -->
    <polygon points="100,50 145,76 145,124 100,150 55,124 55,76" fill="#0f172a" stroke="url(#grad1)" stroke-width="3.5" />
    
    <!-- Dynamic Data Rays -->
    <line x1="100" y1="50" x2="100" y2="100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="124" x2="100" y2="100" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="124" x2="100" y2="100" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    
    <!-- Core Hub -->
    <circle cx="100" cy="100" r="10" fill="url(#grad1)" />
    <circle cx="100" cy="100" r="4" fill="#ffffff" />
    
    <!-- Satellite Quantum Vertices -->
    <circle cx="100" cy="50" r="5" fill="#38bdf8" />
    <circle cx="145" cy="76" r="5" fill="#6366f1" />
    <circle cx="145" cy="124" r="5" fill="#818cf8" />
    <circle cx="100" cy="150" r="5" fill="#a855f7" />
    <circle cx="55" cy="124" r="5" fill="#c084fc" />
    <circle cx="55" cy="76" r="5" fill="#38bdf8" />
  </g>
</svg>
