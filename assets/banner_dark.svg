<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76">
  <!-- Minimalist Transparent Wordmark (Dark Theme) -->
  <g transform="translate(10, 8)">
    <!-- Iconic Monolithic Diamond Glyph -->
    <g transform="translate(6, 4)">
      <!-- Outer Geometric Polygon -->
      <polygon points="26,2 50,26 26,50 2,26" fill="none" stroke="#fafafa" stroke-width="5" stroke-linejoin="round" />
      <!-- Inner Solid Core -->
      <polygon points="26,14 38,26 26,38 14,26" fill="#fafafa" />
    </g>

    <!-- Bold Monolithic Typography -->
    <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#fafafa" letter-spacing="-2">
      RICC
    </text>

    <!-- Precision Vertical Hairline -->
    <line x1="202" y1="12" x2="202" y2="48" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Subtitle Lockup -->
    <text x="218" y="27" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#fafafa" letter-spacing="1">RUSSIAN IT CORPUS</text>
    <text x="218" y="44" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#a1a1aa" letter-spacing="0">1.27M MSGS · 2018–2026</text>
  </g>
</svg>
