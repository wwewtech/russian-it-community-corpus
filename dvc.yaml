# dvc.yaml
# Reproducible data pipeline matching the MasterDataPipeline stages.
# Run: dvc repro
#
# Every stage is a real script (`scripts/dvc_stages.py <stage>`) rather
# than an inline `python -c "..."` block: the inline form does not
# survive a Windows shell (cmd.exe splits the multi-line quoted string
# and the stage dies with "'from' is not recognized"), so `dvc repro`
# had never run in practice.
#
# Parameters come from params.yaml; the stages that use them declare
# them under `params:` so DVC re-runs them when a threshold changes.

stages:
  # Stage 1: Ingestion - Load and merge raw Telegram exports
  ingest:
    cmd: python scripts/dvc_stages.py ingest
    deps:
      # The raw Telegram exports are the actual input of this stage. They
      # are gitignored (they are data, not source) and tracked by DVC, so
      # a change in the corpus re-runs the ingestion.
      #
      # DVC does not expand globs in `deps:`, so every export is listed
      # explicitly. When a new export directory is added, refresh this
      # list (scripts/refresh_dvc_deps.py).
      - ChatExport_2026-08-15/result.json
      - ChatExport_2026-08-16/result.json
      - ChatExport_2026-08-17/result.json
      - ChatExport_2026-08-18/result.json
      - ChatExport_2026-08-19/result.json
      - ChatExport_2026-08-20/result.json
      - ChatExport_2026-08-21/result.json
      - ChatExport_2026-08-22/result.json
      - ChatExport_2026-08-23/result.json
      - ChatExport_2026-08-24/result.json
      - ChatExport_2026-08-25/result.json
      - ricc/ingestion/loader.py
      - ricc/ingestion/schema.py
      - ricc/config.py
      - ricc/bootstrap.py
    outs:
      - dataset_output/intermediate/raw_messages.pkl.gz:
          cache: true

  # Stage 2: PII Anonymization - Deep scrubbing + pseudonymization
  pii_anonymize:
    cmd: python scripts/dvc_stages.py pii_anonymize
    deps:
      - ricc/pii/deep_anonymizer.py
      - ricc/pii/regex_scrubber.py
      - ricc/pii/ner_scrubber.py
      - ricc/pii/anonymizer.py
      - ricc/ingestion/schema.py
      - ricc/config.py
    outs:
      - dataset_output/intermediate/cleaned_messages.pkl.gz:
          cache: true

  # Stage 3: Exact Deduplication - Remove exact duplicate messages
  exact_dedup:
    cmd: python scripts/dvc_stages.py exact_dedup
    deps:
      - ricc/deduplication/exact_dedup.py
      - ricc/ingestion/schema.py
    outs:
      - dataset_output/intermediate/dedup_exact.pkl.gz:
          cache: true

  # Stage 4: MinHash LSH Deduplication - Fuzzy near-duplicate removal
  minhash_dedup:
    cmd: python scripts/dvc_stages.py minhash_dedup
    deps:
      - ricc/deduplication/minhash_lsh.py
      - ricc/config.py
    outs:
      - dataset_output/intermediate/dedup_minhash.pkl.gz:
          cache: true

  # Stage 5: Taxonomy Classification - Domain + keyword tagging
  taxonomy:
    cmd: python scripts/dvc_stages.py taxonomy
    deps:
      - ricc/taxonomy/tagger.py
      - ricc/taxonomy/classifier.py
      - ricc/config.py
    outs:
      - dataset_output/intermediate/tagged_messages.pkl.gz:
          cache: true

  # Stage 6: Thread DAG Reconstruction - Build conversation threads
  graph:
    cmd: python scripts/dvc_stages.py graph
    deps:
      - ricc/graph/thread_builder.py
      - ricc/graph/conversation_extractor.py
      - ricc/ingestion/schema.py
      - ricc/config.py
    outs:
      - dataset_output/intermediate/threaded_messages.pkl.gz:
          cache: true

  # Stage 7: Extract SFT, DPO, RAG datasets from threads
  extract:
    cmd: python scripts/dvc_stages.py extract
    deps:
      - ricc/graph/conversation_extractor.py
      - ricc/ingestion/schema.py
      - ricc/config.py
    outs:
      - dataset_output/intermediate/extracted.pkl.gz:
          cache: true

  # Stage 8: Export to Parquet and JSONL formats
  export:
    cmd: python scripts/dvc_stages.py export
    deps:
      - ricc/exporter/parquet_exporter.py
      - ricc/exporter/jsonl_exporter.py
      - ricc/exporter/rag_exporter.py
      - ricc/exporter/dpo_exporter.py
      - ricc/ingestion/schema.py
      - ricc/config.py
    outs:
      - dataset_output/parquet/full_clean_messages.parquet:
          cache: true
      - dataset_output/parquet/sft_dialogues.parquet:
          cache: true
      - dataset_output/parquet/rag_knowledge_base.parquet:
          cache: true
      - dataset_output/jsonl/sft_sharegpt_format.jsonl:
          cache: true
      - dataset_output/jsonl/sft_alpaca_format.jsonl:
          cache: true
      - dataset_output/jsonl/sft_openai_messages.jsonl:
          cache: true
      - dataset_output/jsonl/rag_chunks_kb.jsonl:
          cache: true
      - dataset_output/jsonl/dpo_preference_pairs.jsonl:
          cache: true

  # Stage 9: Analytics & Reports
  analytics:
    cmd: python scripts/dvc_stages.py analytics
    deps:
      - ricc/analytics/engine.py
      - ricc/analytics/report_generator.py
      - ricc/analytics/metrics.py
      - ricc/analytics/network.py
      - ricc/validation/benchmark.py
      - ricc/config.py
    outs:
      - reports/analytics_summary.json:
          cache: true
      - reports/DEEP_ANALYTICAL_REPORT.md:
          cache: true
      - reports/domain_benchmark_100.json:
          cache: true

  # Stage 10: Validation & PII Audit
  validate:
    cmd: python scripts/dvc_stages.py validate
    deps:
      - ricc/validation/validator.py
      - ricc/validation/probabilistic_audit.py
      - ricc/validation/artifact_manifest.py
      - ricc/validation/hub_reconciliation.py
      - ricc/pii/regex_scrubber.py
      - ricc/config.py
    params:
      - pii_audit.sample_size
      - pii_audit.confidence
      - pii_audit.max_leak_tolerance
    outs:
      - reports/validation_results.json:
          cache: true
      - reports/probabilistic_pii_audit.json:
          cache: true

  # Stage 11: Drift Monitoring (compare against reference)
  drift:
    cmd: python scripts/dvc_stages.py drift
    deps:
      - ricc/monitoring/drift.py
      - ricc/config.py
    params:
      - drift.psi_stable
      - drift.psi_moderate
      - drift.js_stable
      - drift.js_moderate
      - drift.vocab_jaccard_stable
      - drift.vocab_jaccard_moderate
    outs:
      - reports/drift_report.json:
          cache: true

  # Stage 12: SLO Gate - Final release decision
  slo:
    cmd: python scripts/dvc_stages.py slo
    deps:
      - scripts/dvc_stages.py
      - ricc/monitoring/slo_gate.py
      - ricc/validation/artifact_manifest.py
      - ricc/validation/hub_reconciliation.py
      - ricc/config.py
    outs:
      - reports/slo_verdict.json:
          cache: true
