# .pre-commit-config.yaml
# Mirrors CI exactly: ruff==0.16.2, black, mypy==2.3.1
# Run: pre-commit install && pre-commit run --all-files

repos:
  # Ruff - fast Python linter & formatter (replaces flake8, isort, pyupgrade, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        name: Ruff Lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format

  # NOTE: the Black "fallback" hook was removed (2026-10-14): ruff-format is
  # the single formatter (see pyproject [tool.ruff.format] and the CI lint
  # job), and black 24.8 disagrees with it on newly typed code, blocking
  # every commit that touches those files.

  # MyPy - static type checker.
  # Local system hook instead of mirrors-mypy: runs in the project venv with
  # all real deps installed (no duplicated additional_dependencies list), and
  # pass_filenames: false so pre-commit does NOT append staged files on top
  # of the explicit module list (the previous behavior produced mypy
  # "Duplicate module named" errors whenever a listed module was staged).
  # Mirrors `make typecheck-strict` / the CI typecheck job 1:1.
  - repo: local
    hooks:
      - id: mypy-strict
        name: MyPy Typecheck (strict, 45 modules)
        entry: python -m mypy
        language: system
        pass_filenames: false
        args:
          - --strict
          - ricc/config.py
          - ricc/errors.py
          - ricc/bootstrap.py
          - ricc/ingestion/schema.py
          - ricc/ingestion/loader.py
          - ricc/analytics/metrics.py
          - ricc/analytics/network.py
          - ricc/analytics/report_generator.py
          - ricc/analytics/engine.py
          - ricc/taxonomy/classifier.py
          - ricc/taxonomy/tagger.py
          - ricc/deduplication/exact_dedup.py
          - ricc/deduplication/minhash_lsh.py
          - ricc/monitoring/drift.py
          - ricc/monitoring/sft_quality.py
          - ricc/monitoring/slo_gate.py
          - ricc/rag/rag_pipeline.py
          - ricc/rag/__init__.py
          - ricc/evaluation/__init__.py
          - ricc/evaluation/statistical_power.py
          - ricc/evaluation/benchmark_comparator.py
          - ricc/evaluation/official_academic_benchmarks.py
          - ricc/evaluation/deep_multi_experiment_suite.py
          - ricc/evaluation/enterprise_production_eval_suite.py
          - ricc/evaluation/sota_expert_benchmark_showcase.py
          - ricc/lora/__init__.py
          - ricc/lora/train_lora.py
          - ricc/lora/batch_train_zoo.py
          - ricc/lora/generate_demo.py
          - ricc/lora/train_20_popular_models.py
          - ricc/lora/train_heavyweight_5_sota.py
          - ricc/graph/__init__.py
          - ricc/orchestration/prefect_flow.py
          - ricc/validation/artifact_manifest.py
          - ricc/validation/hub_reconciliation.py
          - ricc/validation/validator.py
          - ricc/pii/regex_scrubber.py
          - ricc/pii/ner_scrubber.py
          - ricc/pii/deep_anonymizer.py
          - ricc/inference.py
          - ricc/pipeline.py
          - ricc/exporter/finalize_sync_all.py
          - ricc/observability/__init__.py
          - ricc/ml_runtime.py
          - ricc/__init__.py

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        # mkdocs.yml uses python/name: tags (material emoji registry) that
        # pyyaml cannot resolve; the file is validated by
        # `mkdocs build --strict` in CI instead.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Validate pyproject.toml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml

  # Local secret scan — same baseline CI enforces (.secrets.baseline).
  # Fails only on NEW findings; generated JSON with sha256 provenance
  # hashes and model identifiers is excluded at scan time (see CI job).
  - repo: local
    hooks:
      - id: detect-secrets-local
        name: detect-secrets (no new secrets)
        entry: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline
        language: system
        pass_filenames: false
        always_run: true

ci:
  autofix_commit_msg: |
    [pre-commit] Auto fixes from ruff

  # Skip on CI if already run locally (speed up)
  skip: [mypy-strict]
