name: Publish verified release container

on:
  workflow_run:
    workflows: ["Data Platform CI & Validation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Data Platform CI release run ID
        required: true
        type: string
      release_sha:
        description: Exact commit verified by that release run
        required: true
        type: string
      release_tag:
        description: Release tag (for example v12.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker-release:
    # This separate workflow is the only release container publication path.
    # Its read-only preflight and the GitHub package/catalog publication must
    # both have completed successfully first.
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify the manually selected successful release run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" > release-run.json
          jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
            .event == "release" and .conclusion == "success" and
            .head_sha == $sha and .head_branch == $tag
          ' release-run.json

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag || github.event.workflow_run.head_branch }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || github.event.workflow_run.head_branch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # workflow_run does not grant the Actions cache write scope used by
          # buildx. The release job's package write permission is separate;
          # do not fail a verified container publication on a cache export.
          cache-to: type=inline
