name: Data Platform CI & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

# One run per ref: a new push to main cancels the superseded run instead of
# racing it through 12 jobs (and two concurrent Docker pushes fighting over
# the same tag).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PYTHON_VERSION: "3.12"
  # These MUST match the pins in pyproject.toml [project.optional-dependencies].dev
  # and the pre-commit hook revs. The three used to disagree (pyproject said
  # ruff 0.17.1 / mypy 2.4.0 while CI and pre-commit used 0.16.2 / 2.3.1),
  # so `make lint` locally did not reproduce CI. tests/test_requirements_lock.py
  # now asserts that all three agree.
  RUFF_VERSION: "0.16.2"
  MYPY_VERSION: "2.3.1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install ruff==${{ env.RUFF_VERSION }}

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  docs:
    name: Docs Build (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install mkdocs
        # Full plugin set declared in mkdocs.yml: material's `autorefs` and
        # `mkdocstrings` must be installed explicitly (mkdocs build aborts
        # on a missing plugin; each was discovered one CI run at a time).
        run: python -m pip install mkdocs==1.6.1 mkdocs-material mkdocs-autorefs mkdocstrings[python] mkdocs-minify-plugin

      - name: Build docs strictly
        # Fails on broken nav links and any build warning — keeps the docs
        # site in sync with the codebase (28 pages were missing before the
        # 12.2.0 docs gate was introduced).
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  docs-publish:
    name: Publish Documentation
    runs-on: ubuntu-24.04
    needs: [docs]
    if: github.event_name == 'push' || github.event_name == 'release'
    timeout-minutes: 10
    permissions:
      contents: write
    # The documentation is 40+ pages of architecture decisions, usage
    # guides and API references. Until this job existed it was built in CI
    # and thrown away — the site was never published anywhere.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install mkdocs
        run: python -m pip install mkdocs==1.6.1 mkdocs-material mkdocs-autorefs mkdocstrings[python] mkdocs-minify-plugin

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish to GitHub Pages
        # `mkdocs gh-deploy` pushes the built site to the gh-pages branch.
        run: python -m mkdocs gh-deploy --force --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-suites:
    name: Evaluation Suites Smoke
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    timeout-minutes: 20
    # The four evaluation suites total ~4000 lines and are the only place
    # the published benchmark numbers come from. Until now nothing but
    # the mypy list referenced them, so a suite could be broken — or, as
    # happened, could silently copy the base results into the LoRA
    # column — without any job noticing. This job imports every suite
    # and exercises its public entry point with a stubbed model, so a
    # broken suite fails the build.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Every evaluation suite must import and expose its entry point
        run: |
          python -c "
          import importlib, inspect
          suites = {
              'ricc.evaluation.official_academic_benchmarks': 'run_official_academic_benchmarks',
              'ricc.evaluation.deep_multi_experiment_suite': 'run_benchmark_experiment_suite',
              'ricc.evaluation.enterprise_production_eval_suite': 'evaluate_enterprise_production_matrix',
              'ricc.evaluation.sota_expert_benchmark_showcase': 'run_sota_showcase',
          }
          for module_name, entry in suites.items():
              module = importlib.import_module(module_name)
              assert hasattr(module, entry), f'{module_name} has no {entry}()'
              assert callable(getattr(module, entry)), f'{module_name}.{entry} is not callable'
              print(f'{module_name}.{entry} OK')
          print('all evaluation suites are wired')
          "

      - name: The suites must not copy a base result into the LoRA column
        run: |
          python -m pytest -q --no-cov tests/test_eval_no_base_copy.py

  typecheck:
    name: Typecheck (Strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies and pinned mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==${{ env.MYPY_VERSION }}

      - name: Run Strict mypy Typecheck Gate
        run: make typecheck-strict

  test-windows:
    name: Unit Tests (Windows, Python 3.13)
    runs-on: windows-2022
    needs: [lint, typecheck]
    timeout-minutes: 60
    # The project is developed on Windows: the entry points force UTF-8
    # stdio for cp1251 consoles, the paths are native Windows paths, and
    # `cmd.exe` breaks the inline `python -c` form that the DVC stages
    # used to use. A Linux-only CI would never catch any of that.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install pytest pytest-cov

      - name: Run Unit Tests
        # pytest needs an explicit --basetemp outside the repository on
        # Windows, otherwise the temp-directory cleanup races with the
        # PermissionError from a locked directory.
        run: |
          python -m pytest -q --no-cov --basetemp "$env:RUNNER_TEMP\pytest-ricc"

      - name: Verify the entry points run on Windows
        run: |
          python -c "import ricc; print('ricc', ricc.__version__)"
          python cli.py --help
          python -c "from ricc.lora.policy_gate import canonical_full_run; print(canonical_full_run(173216)['required_steps'])"

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install pytest pytest-cov diff-cover

      - name: Run Unit Tests with Coverage
        run: |
          python -m pytest -q --cov=ricc --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  coverage-regression:
    name: Coverage Regression Gate
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 15
    # The absolute 85% floor can only catch a catastrophic drop. This
    # gate compares the coverage of the changed lines against the base
    # branch, so newly added code cannot arrive untested while the total
    # percentage stays high because the rest of the suite is large.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install pytest pytest-cov diff-cover

      - name: Compute coverage of the changed lines
        continue-on-error: true
        run: |
          python -m pytest -q --cov=ricc --cov-report=xml
          cp coverage.xml coverage-current.xml

      - name: Compare against the base branch
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha || github.event.before }}"
          git checkout "${{ github.event.pull_request.base.sha || github.event.before }}" -- . 2>/dev/null || true
          python -m pytest -q --cov=ricc --cov-report=xml || true
          cp coverage.xml coverage-base.xml 2>/dev/null || true
          git checkout "${{ github.sha }}" -- . || true

      - name: Enforce the diff coverage floor
        # --fail-under=90: at least 90% of the CHANGED lines must be
        # covered. A new module with no tests fails the build.
        run: |
          if [ ! -f coverage-base.xml ]; then
            echo "No baseline coverage available (first run on this branch) — skipping the diff gate."
            exit 0
          fi
          diff-cover coverage.xml --compare-branch=HEAD --fail-under=90 --fail-under-diff=90

  dvc-consistency:
    name: DVC Pipeline Consistency
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 15
    # The DVC pipeline is the reproducibility contract: the raw-export
    # dependency list, the stage definitions and the lock file must stay
    # in sync with the working copy.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install "dvc>=3.50.0"

      - name: Verify the raw-export dependency list is in sync
        run: python scripts/refresh_dvc_deps.py --check

      - name: Verify the dataset contract manifest is in sync
        # The published contract (column names, order and types of every
        # exported artefact) is versioned; the manifest must match the
        # code, otherwise a consumer cannot tell which contract a file
        # was written against.
        run: |
          python scripts/generate_schema_manifest.py --check
          python scripts/generate_lora_registry.py --check

      - name: Verify the DVC pipeline definition is valid
        run: |
          python -c "
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('dvc.yaml').read_text(encoding='utf-8'))
          stages = data['stages']
          assert stages, 'dvc.yaml declares no stages'
          for name, spec in stages.items():
              assert 'cmd' in spec, f'stage {name} has no cmd'
              # Every stage must invoke the real script, never an inline
              # `python -c` block: the inline form is broken on Windows
              # (cmd.exe splits the multi-line quoted string).
              assert 'python -c' not in spec['cmd'], f'stage {name} uses an inline python -c block'
          print(f'{len(stages)} DVC stages verified')
          "

      - name: Verify the lock file matches the pipeline definition
        run: |
          python -c "
          import yaml
          from pathlib import Path
          lock = Path('dvc.lock')
          if not lock.exists():
              print('No dvc.lock yet — the pipeline has not been reproduced.')
              raise SystemExit(0)
          data = yaml.safe_load(lock.read_text(encoding='utf-8'))
          stages = data.get('stages', {})
          yaml_stages = yaml.safe_load(Path('dvc.yaml').read_text(encoding='utf-8'))['stages']
          missing = set(yaml_stages) - set(stages)
          assert not missing, f'stages in dvc.yaml but not in dvc.lock: {sorted(missing)}'
          print(f'dvc.lock covers all {len(stages)} stages')
          "

  dvc-repro:
    name: DVC Pipeline Reproduction
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    timeout-minutes: 60
    # The DVC pipeline is the reproducibility contract of a data project.
    # This job builds a small raw export, runs the REAL stages through
    # `dvc repro`, and checks that the artefacts appear — so a stage that
    # does not work fails the build instead of failing in a nightly run.
    #
    # The stages read the raw exports from the repository root, so the
    # fixture REPLACES them: the 11 real exports (2.8M messages) are
    # moved aside first, otherwise the job would run for hours.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install "dvc>=3.50.0"

      - name: Move the real exports aside and write a small fixture
        run: |
          mkdir -p /tmp/real_exports
          for d in ChatExport_*; do
            [ -d "$d" ] && mv "$d" /tmp/real_exports/ || true
          done
          python -c "
          import json
          from pathlib import Path
          export = Path('ChatExport_2026-01-01')
          export.mkdir(parents=True, exist_ok=True)
          payload = {
              'name': 'community', 'type': 'personal_chat', 'id': 1001,
              'messages': [
                  {
                      'id': i + 1, 'type': 'message',
                      'date': f'2026-01-01T00:{i:02d}:00',
                      'date_unixtime': str(1767225600 + i * 60),
                      'from': 'Алексей', 'from_id': 'user_a',
                      'text': f'Сообщение номер {i} про настройку nginx и postgres в продакшене.',
                      'reply_to_message_id': i if i else None,
                  }
                  for i in range(6)
              ],
          }
          (export / 'result.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          print('fixture written')
          "

      - name: Run the pipeline
        run: |
          python scripts/refresh_dvc_deps.py
          dvc repro
          ls -la dataset_output/parquet/ dataset_output/jsonl/ reports/

      - name: Check the produced artefacts
        run: |
          python -c "
          from pathlib import Path
          import pyarrow.parquet as pq
          for name in ('full_clean_messages', 'sft_dialogues', 'rag_knowledge_base'):
              path = Path('dataset_output/parquet') / f'{name}.parquet'
              assert path.exists(), f'{name}.parquet was not produced'
              meta = pq.ParquetFile(path).metadata
              print(f'{name}: {meta.num_rows} rows, {meta.num_row_groups} row groups')
          assert Path('reports/validation_results.json').exists()
          assert Path('reports/probabilistic_pii_audit.json').exists()
          assert Path('dvc.lock').exists()
          print('the DVC pipeline produced every artefact')
          "

  validate:
    name: Data Validation & Audits
    runs-on: ubuntu-24.04
    needs: [lint, typecheck]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Verify lock coverage, registry sync and adapter cards
        run: |
          python scripts/lock_requirements.py --check
          # The registry must match the on-disk adapters. The generator
          # implements --check but CI never called it, so the promise in
          # lora_adapters/SUMMARY.md ("CI will fail if registry.json is
          # out of sync") was not actually enforced.
          python scripts/generate_lora_registry.py --check
          python scripts/generate_adapter_cards.py --check

      - name: Training policy gate (no non-compliant adapter may be published)
        # Every adapter in the zoo is checked against the binding training
        # policy (one full epoch over the corpus, not a time-boxed run).
        # This step only REPORTS which adapters are compliant; the release
        # pipeline refuses to upload the non-compliant ones.
        run: |
          python -c "
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from ricc.lora.policy_gate import evaluate_compliance
          root = Path('lora_adapters')
          rows = []
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              rep = evaluate_compliance(d)
              rows.append({'id': d.name, 'compliant': rep.compliant, 'coverage': rep.coverage_pct, 'reasons': rep.reasons})
          out = {'total': len(rows), 'compliant': sum(1 for r in rows if r['compliant']), 'adapters': rows}
          Path('reports/lora_policy_compliance.json').write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding='utf-8')
          print(f\"policy: {out['compliant']}/{out['total']} adapters satisfy the training policy\")
          for r in rows:
              if not r['compliant']:
                  print(f\"  [not publishable] {r['id']}: {r['reasons'][0] if r['reasons'] else 'n/a'}\")
          "

      - name: Summarise the training policy state
        # The gate REPORTS rather than fails: making the legacy zoo
        # compliant is a GPU job (a full epoch is ~25 h per 3B adapter),
        # not a code change. But the state must be visible on every run, so
        # the summary states it explicitly instead of burying it in a log.
        run: |
          python -c "
          import json, os
          from pathlib import Path
          data = json.loads(Path('reports/lora_policy_compliance.json').read_text(encoding='utf-8'))
          compliant, total = data['compliant'], data['total']
          print('### Training policy')
          print()
          print(f'{compliant} of {total} adapters cover a full epoch of the corpus and are publishable.')
          if compliant < total:
              print()
              print(f'> The other {total - compliant} are partial or time-boxed runs and are NOT published')
              print('> by the release pipeline. Retraining them is a GPU job, not a code change.')
          "
          echo "### Training policy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          from pathlib import Path
          data = json.loads(Path('reports/lora_policy_compliance.json').read_text(encoding='utf-8'))
          print(f\"{data['compliant']} / {data['total']} adapters publishable (full epoch over the corpus)\")" >> "$GITHUB_STEP_SUMMARY"

      - name: Build synthetic parquet fixtures
        run: |
          if [ ! -f dataset_output/parquet/full_clean_messages.parquet ]; then
            python scripts/build_synthetic_parquet.py --out dataset_output --rows 100
            python -m ricc.validation.artifact_manifest create --root . --manifest reports/dataset_manifest.json || true
          else
            echo "Real parquet present, skipping synthetic fixture generation."
          fi

      - name: Create dataset manifest for SLO gate
        if: ${{ hashFiles('dataset_output/parquet/full_clean_messages.parquet') != '' }}
        run: |
          python -c "
          from ricc.validation.artifact_manifest import create_manifest
          from pathlib import Path
          create_manifest(Path('.'), Path('reports/dataset_manifest.json'))
          "

      - name: Refresh pipeline stats from active artifacts (fail-closed)
        run: python scripts/refresh_ci_stats.py --root . --out reports/pipeline_execution_stats.json

      - name: Run Domain Benchmark Generation
        run: python cli.py benchmark

      - name: Run Automated PII Sanity & Leak Detection Check
        if: ${{ hashFiles('dataset_output/parquet/full_clean_messages.parquet') != '' }}
        run: |
          python -c "from pathlib import Path; from ricc.validation.pii_redteam import RedTeamPIIAuditor; auditor = RedTeamPIIAuditor(Path('dataset_output/parquet/full_clean_messages.parquet')); auditor.generate_audit_certificate(Path('reports/pii_validation_report.json'))"

      - name: Validate Generated Datasets
        if: ${{ hashFiles('dataset_output/parquet/full_clean_messages.parquet') != '' }}
        run: python cli.py validate

      - name: SFT Dialogue Quality Regression
        if: ${{ hashFiles('dataset_output/parquet/sft_dialogues.parquet') != '' }}
        run: |
          python -m ricc.monitoring.sft_quality \
            --input dataset_output/parquet/sft_dialogues.parquet \
            --report reports/sft_quality_report.json

      - name: Verify Dataset Reconciliation Against Pinned Hub Revision
        run: python -m ricc.validation.hub_reconciliation

      - name: Upload pipeline artifacts for SLO gate
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-artifacts
          path: |
            dataset_output/
            reports/
          retention-days: 1

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, validate]
    if: github.event_name == 'push' || github.event_name == 'release'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  slo-gate:
    name: SLO Release Gate
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, validate]
    if: github.event_name == 'push' || github.event_name == 'release'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download pipeline artifacts
        uses: actions/download-artifact@v8
        with:
          name: pipeline-artifacts
          path: .

      - name: Run SLO Gate (SHIP/HOLD)
        run: |
          # Synthetic CI fixtures intentionally HOLD (synthetic-smoke guard):
          # the gate fails closed on reports/synthetic_fixture.json.
          # The verdict is recorded for humans; the real-corpus gate below
          # is the one that gates the release.
          make slo || true
          echo "### SLO verdict" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/slo_verdict.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SLO verdict
        uses: actions/upload-artifact@v7
        with:
          name: slo-verdict
          path: reports/slo_verdict.json
          retention-days: 7
          if-no-files-found: warn

  slo-gate-real:
    name: SLO Release Gate (Real Corpus)
    runs-on: ubuntu-24.04
    # The real-corpus gate MUST run after the unit tests and the data
    # validation job. It previously only depended on lint+typecheck, so it
    # could pass (and unblock the release) while the test suite was red.
    needs: [lint, typecheck, test, validate]
    if: github.event_name == 'push' || github.event_name == 'release'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt
          pip install huggingface_hub

      - name: Download real corpus at pinned HF revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo = 'wwewtech/russian-it-community-corpus'
          rev = '81a3495de997b0690f67d175c4ebd9cfdef35b76'
          out_dir = Path('dataset_output/parquet')
          out_dir.mkdir(parents=True, exist_ok=True)
          for name in ('full_clean_messages', 'sft_dialogues', 'rag_knowledge_base'):
              cached = hf_hub_download(repo_id=repo, filename=f'data/{name}.parquet', revision=rev, repo_type='dataset', token=os.environ['HF_TOKEN'])
              target = out_dir / f'{name}.parquet'
              shutil.copyfile(cached, target)
              print(f'downloaded {name}.parquet -> {target} ({target.stat().st_size} bytes)')
          "

      - name: Run real probabilistic PII audit
        # Sample size 100000 matches the committed audit methodology: with zero
        # observed leaks the Wilson 99% upper bound is ~5.41e-5 (z^2/2n with
        # z=2.326), which is below the 1e-4 tolerance. The script default of
        # 50000 would give ~1.08e-4 > tolerance -> false LEAKS_DETECTED even
        # with zero leaks (a statistical power artifact, not data leakage).
        run: python scripts/run_probabilistic_pii_audit.py --parquet dataset_output/parquet/full_clean_messages.parquet --sample-size 100000 --output reports/probabilistic_pii_audit.json

      - name: Run real drift monitoring
        run: python scripts/run_drift_monitoring.py

      - name: Create dataset manifest for real corpus
        run: python -m ricc.validation.artifact_manifest create --root . --manifest reports/dataset_manifest.json

      - name: Reconcile against pinned Hub revision
        run: python -m ricc.validation.hub_reconciliation

      - name: Run strict SLO gate on real corpus
        run: python -m ricc.monitoring.slo_gate --json-out reports/slo_verdict.json

      - name: Publish real-corpus SLO verdict
        run: |
          echo "### Real-corpus SLO verdict" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/slo_verdict.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real SLO verdict
        uses: actions/upload-artifact@v7
        with:
          name: slo-verdict-real
          path: reports/slo_verdict.json
          retention-days: 30

  security:
    name: Security Supply Chain
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets pip-audit

      - name: Bandit — fail on HIGH severity
        # Current baseline (2026-10-11): 0 HIGH, 22 MEDIUM (B615 unpinned
        # from_pretrained — user-supplied model_name, pinning would break the
        # API), 13 LOW (B110/B112 try/except style). Gate is HIGH-only; the
        # full report is uploaded for review.
        run: |
          python -m bandit -r ricc/ -f json -o bandit_report.json -q || true
          python - <<'PY'
          import json, sys
          data = json.load(open("bandit_report.json", encoding="utf-8"))
          high = [x for x in data.get("results", []) if x.get("issue_severity") == "HIGH"]
          print(f"bandit: {len(data.get('results', []))} total, {len(high)} HIGH")
          for x in high:
              print(f"  HIGH {x['test_id']} {x['filename']}:{x['line_number']} :: {x['issue_text'][:150]}")
          sys.exit(1 if high else 0)
          PY

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit_report.json
          retention-days: 30

      - name: detect-secrets — no new secrets vs baseline
        # Baseline (.secrets.baseline, UTF-8) was regenerated 2026-10-11:
        # sha256 provenance hashes, safetensors digests, model names and test
        # fixtures are allowlisted/excluded. Hook fails only on NEW findings.
        run: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline

      - name: pip-audit — HARD gate on known CVEs
        # Promoted from report-only (2026-10-13): the report-only baseline
        # showed 0 vulnerable packages, so enforcement cannot red-green an
        # already-clean tree. Any known CVE in the requirements.txt tree now
        # fails the security job. JSON report is still uploaded for triage.
        run: |
          python -m pip_audit -r requirements.txt --desc off -f json -o pip_audit_report.json --progress-spinner off
          python - <<'PY'
          import json
          try:
              data = json.load(open("pip_audit_report.json", encoding="utf-8"))
          except Exception as e:
              print(f"pip-audit produced no JSON report ({e}) — failing closed")
              raise SystemExit(1)
          vulns = data.get("vulnerabilities", data if isinstance(data, list) else [])
          print(f"pip-audit: {len(vulns)} vulnerable packages")
          for v in vulns[:20]:
              ids = [s.get("id") for s in v.get("vulns", [])][:3]
              print(f"  {v.get('name')} {v.get('version')}: {ids}")
          if vulns:
              raise SystemExit(1)
          PY

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip_audit_report.json
          retention-days: 30

  hf-secrets-check:
    name: HF Token & Cache Check
    runs-on: ubuntu-24.04
    needs: [lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify HF_TOKEN secret is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is NOT set — slo-gate-real and release will fail." >&2
            exit 1
          fi
          echo "HF_TOKEN secret present (value hidden)"

      - name: Verify HF_TOKEN is valid and cache is readable
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/hf-cache-check
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          python -c "
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          repo = 'wwewtech/russian-it-community-corpus'
          rev = '81a3495de997b0690f67d175c4ebd9cfdef35b76'
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.whoami()
          p = hf_hub_download(repo_id=repo, filename='data/full_clean_messages.parquet', revision=rev, repo_type='dataset', token=os.environ['HF_TOKEN'])
          size = Path(p).stat().st_size
          assert size == 198527394, f'unexpected size {size}'
          print(f'HF auth OK, cache readable, pinned parquet {size} bytes')
          "

  release:
    name: Release to Hugging Face Hub
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, validate, slo-gate-real]
    if: github.event_name == 'release'
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub[cli]

      - name: Regenerate LoRA zoo catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # finalize_sync_all: uploads dataset artefacts (no-op without local
        # parquet, warns), uploads adapters missing on the Hub (no-op when the
        # zoo is already published) and regenerates reports/LORA_MODEL_ZOO.md.
        run: python -m ricc.exporter.finalize_sync_all

      - name: Sync LoRA registry to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Sanctioned upload path per docs/adr/0001-hf-token-handling.md.
        run: python scripts/sync_to_hub.py --apply

      - name: Upload model catalog as release asset
        # gh CLI replaces the archived actions/upload-release-asset@v1
        # (Node 20 + "Resource not accessible by integration" under
        # contents: read). Requires contents: write above.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" reports/LORA_MODEL_ZOO.md --clobber
