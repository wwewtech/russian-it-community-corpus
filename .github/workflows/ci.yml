name: Data Platform CI & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install ruff
      # Pin the version so a new ruff release cannot unexpectedly break CI;
      # matches the version used to validate the codebase (see pyproject.toml).
      run: python -m pip install ruff==0.16.2

    - name: Run linter
      run: ruff check .

    - name: Check formatting
      run: ruff format --check .

  test-and-validate:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (pytest)
      run: |
        python -m pytest -q

    - name: Run Domain Benchmark Generation
      run: |
        python cli.py benchmark

    # --- Synthetic parquet fixtures for the data-dependent steps ---------
    # The production parquet/JSONL artifacts are gitignored (they live on
    # the Hugging Face Hub, not in the repository), so on a vanilla PR
    # build they would be absent and the next three steps would short-
    # circuit to "skipped".  ``scripts/build_synthetic_parquet.py`` emits
    # a tiny (~5 KB) self-contained fixture set that satisfies the
    # schemas expected by the PII red-team, the dataset validator, and
    # the SFT quality monitor.  The fixture is deterministic, free of
    # real PII, and small enough to ship in a PR diff.
    #
    # When a real parquet is present (self-hosted runner with pre-staged
    # artifacts, or a tagged release) this step is a no-op because the
    # production files already exist on disk.
    - name: Build synthetic parquet fixtures
      run: |
        if [ ! -f dataset_output/parquet/full_clean_messages.parquet ]; then
          python scripts/build_synthetic_parquet.py --out dataset_output --rows 100
        else
          echo "Real parquet present, skipping synthetic fixture generation."
        fi

    # Dataset binaries are gitignored (hosted on Hugging Face), so these
    # data-dependent audits only execute when artifacts are present,
    # e.g. on self-hosted runners, on a tagged release, or after the
    # synthetic-fixture step above has populated dataset_output/.
    - name: Run Automated PII Sanity & Leak Detection Check
      if: ${{ hashFiles('dataset_output/parquet/full_clean_messages.parquet') != '' }}
      run: |
        python -c "from pathlib import Path; from src.validation.pii_redteam import RedTeamPIIAuditor; auditor = RedTeamPIIAuditor(Path('dataset_output/parquet/full_clean_messages.parquet')); auditor.generate_audit_certificate(Path('reports/pii_validation_report.json'))"

    - name: Validate Generated Datasets
      if: ${{ hashFiles('dataset_output/parquet/full_clean_messages.parquet') != '' }}
      run: |
        python cli.py validate

    # SFT dialogue quality regression check. Catches silent extraction
    # failures (empty replies, role imbalance, English drift, duplicate
    # turns). Runs whenever the SFT parquet is present; fails the build
    # if any sub-score falls below its floor.
    - name: SFT Dialogue Quality Regression
      if: ${{ hashFiles('dataset_output/parquet/sft_dialogues.parquet') != '' }}
      run: |
        python -m src.monitoring.sft_quality \
          --input dataset_output/parquet/sft_dialogues.parquet \
          --report reports/sft_quality_report.json
