services:
  data-studio:
    build: .
    container_name: it_community_data_studio
    user: "10001:10001"
    ports:
      - "8501:8501"
    volumes:
      - ./dataset_output:/app/dataset_output
      - ./reports:/app/reports
      - hf-cache:/app/.hf_cache
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - HF_HOME=/app/.hf_cache
      - TOKENIZERS_PARALLELISM=false
      # HF_TOKEN is optional; only needed for gated models / Hub sync.
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          memory: 2G

  pipeline-runner:
    build: .
    container_name: it_community_pipeline_runner
    user: "10001:10001"
    command: ["python", "main.py"]
    volumes:
      - ./dataset_output:/app/dataset_output
      - ./reports:/app/reports
      - hf-cache:/app/.hf_cache
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - HF_HOME=/app/.hf_cache
      - TOKENIZERS_PARALLELISM=false
      - HF_TOKEN=${HF_TOKEN:-}
    profiles:
      - pipeline
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G

volumes:
  hf-cache:
