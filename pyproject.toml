[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricc"
version = "12.2.0"
description = "RICC: Russian IT Community Corpus — Data Engineering and Zero-PII Curation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "wwewtech", email = "research@wwew.tech" }
]
keywords = [
    "llm", "sft", "dpo", "rag", "lora", "dataset", "nlp", "russian-nlp", "zero-pii"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "xxhash>=3.4.0",
    "ujson>=5.9.0",
    "tqdm>=4.66.0",
    "natasha>=1.6.0",
    "slovnet>=0.6.0",
    "razdel>=0.5.0",
    "yargy>=0.16.0",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.0",
    "streamlit>=1.32.0",
    "rich>=13.7.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Data-platform extras: orchestration (Prefect) and data versioning (DVC).
# Both are optional — the platform degrades gracefully without them
# (sequential flow execution, plain filesystem artifacts).
platform = [
    "prefect>=2.19.0",
    "dvc>=3.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1",
    # Pinned to the exact ruff version used by pre-commit (.pre-commit-config.yaml)
    # and CI (.github/workflows/ci.yml) so local, hook, and CI lint always agree.
    "ruff==0.17.1",
    "black>=24.0.0",
    # Pinned so typechecking results remain deterministic between local and CI.
    "mypy==2.4.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
it-pipeline = "cli:main"
# NOTE: the Streamlit Data Studio is intentionally NOT a console script —
# Streamlit apps must be served by the Streamlit runtime: `make ui` or
# `streamlit run app.py`. A bare `app:main` entry point would execute the
# script outside the Streamlit runtime and render nothing.

[tool.setuptools]
# Root-level entry modules (cli.py, main.py)
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".hf_cache",
    ".pre-commit-cache",
    "ChatExport_*",
    "dataset_output",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts call setup_runtime_env() (UTF-8 stdio, HF cache, env
# defaults) BEFORE importing torch/transformers/peft — those imports are
# intentionally below the setup call and carry no per-line noqa anymore
# (the 65 stale `# noqa: E402` markers were removed; policy is here).
"src/evaluation/*.py" = ["E402"]
"src/lora/*.py" = ["E402"]
"src/inference.py" = ["E402"]
"src/exporter/finalize_sync_all.py" = ["E402"]
"src/observability/__init__.py" = ["E402"]

# NOTE: per-file E402 ignores were removed — runtime env setup is centralized
# in src/bootstrap.py (setup_runtime_env()); imports below the call carry an
# explicit `# noqa: E402` where needed.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Strict rollout COMPLETE (2026-10-14): no [[tool.mypy.overrides]]
# ignore_errors blocks remain. Every src/ module passes `mypy --strict`;
# untyped third-party calls (HF/PEFT/transformers) are fenced behind
# `cast(Any, ...)` — the single sanctioned pattern, see src/inference.py.
# The full module list is verified by `make typecheck-strict` and the
# pre-commit mypy-strict hook.
#
# History: rollout started 2026-09-17 with src.analytics.engine,
# src.graph.*, src.inference, src.pipeline, src.exporter.finalize_sync_all
# already strict. Phase 1 (2026-10-12): src.lora.* (5 modules) +
# src.evaluation.official_academic_benchmarks + benchmark_comparator.
# Phase 2 (2026-10-14): the last 3 heavy eval suites —
# deep_multi_experiment_suite (89 errors), enterprise_production_eval_suite
# (34), sota_expert_benchmark_showcase (29) — typed via list[dict[str, Any]]
# annotations on the data tables + up-front local annotations with
# `cast()` in fallback branches that read dict[str, Any] values.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-p no:asyncio --cov=src --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: tests that require locally generated dataset artifacts (deselected by default when combined with -m 'not integration')",
]

[tool.coverage.run]
# Unit coverage measures CPU-testable library code. GPU/LLM-gated suites
# (LoRA training, enterprise eval) run on self-hosted runners / manually
# and are excluded from the 60% gate — see tests/test_hybrid_rag_slo.py
# and CI test-and-validate job for what IS gated.
omit = [
    "src/lora/train_*.py",
    "src/lora/batch_train_zoo.py",
    "src/lora/generate_demo.py",
    "src/evaluation/enterprise_production_eval_suite.py",
    "src/evaluation/deep_multi_experiment_suite.py",
    "src/evaluation/sota_expert_benchmark_showcase.py",
]
