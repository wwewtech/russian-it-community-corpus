[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricc"
version = "12.0.0"
description = "RICC: Russian IT Community Corpus — Data Engineering and Zero-PII Curation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "wwewtech", email = "research@wwew.tech" }
]
keywords = [
    "llm", "sft", "dpo", "rag", "lora", "dataset", "nlp", "russian-nlp", "zero-pii"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "xxhash>=3.4.0",
    "ujson>=5.9.0",
    "tqdm>=4.66.0",
    "natasha>=1.6.0",
    "slovnet>=0.6.0",
    "razdel>=0.5.0",
    "yargy>=0.16.0",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.0",
    "streamlit>=1.32.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Data-platform extras: orchestration (Prefect) and data versioning (DVC).
# Both are optional — the platform degrades gracefully without them
# (sequential flow execution, plain filesystem artifacts).
platform = [
    "prefect>=2.19.0",
    "dvc>=3.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1",
    # Pinned to the exact ruff version used by pre-commit (.pre-commit-config.yaml)
    # and CI (.github/workflows/ci.yml) so local, hook, and CI lint always agree.
    "ruff==0.16.2",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
it-pipeline = "cli:main"
# NOTE: the Streamlit Data Studio is intentionally NOT a console script —
# Streamlit apps must be served by the Streamlit runtime: `make ui` or
# `streamlit run app.py`. A bare `app:main` entry point would execute the
# script outside the Streamlit runtime and render nothing.

[tool.setuptools]
# Root-level entry modules (cli.py, main.py) plus the src/ package tree,
# so `pip install .` produces a working `it-pipeline` console command.
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".hf_cache",
    "ChatExport_*",
    "dataset_output",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # do not perform function calls in argument defaults
]

# NOTE: per-file E402 ignores were removed — runtime env setup is centralized
# in src/bootstrap.py (setup_runtime_env()); imports below the call carry an
# explicit `# noqa: E402` where needed.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Slow-mode rollout: strict checks only for the modules listed in
# `make typecheck-strict`; extend module-by-module, not all of src/ at once.

# GPU/eval modules are excluded from type checking for now: they rely on
# untyped dict payloads from model outputs and torch/peft stubs. Re-enable
# module-by-module as they get typed (see `make typecheck-strict`).
[[tool.mypy.overrides]]
module = [
    "src.evaluation.*",
    "src.lora.*",
    "src.inference",
    "src.pipeline",
    "src.analytics.engine",
    "src.graph.*",
    "src.exporter.finalize_sync_all",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-p no:asyncio --cov=src --cov-report=term-missing --cov-fail-under=60"
markers = [
    "integration: tests that require locally generated dataset artifacts (deselected by default when combined with -m 'not integration')",
]
