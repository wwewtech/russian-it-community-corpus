apiVersion: v1
kind: Service
metadata:
  name: ricc-data-studio
  labels:
    app: ricc-data-studio
spec:
  type: ClusterIP
  selector:
    app: ricc-data-studio
  ports:
    - port: 8501
      targetPort: 8501
      name: http
    # Prometheus metrics endpoint served by prometheus_client inside the
    # pod (maybe_start_metrics_server(9090)); cluster-internal only.
    - port: 9090
      targetPort: 9090
      name: metrics
